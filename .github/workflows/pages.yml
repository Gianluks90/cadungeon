# Pubblica l'app su GitHub Pages a ogni push su dev (o a mano, dalla scheda Actions).
# L'indirizzo è https://<utente>.github.io/<repository>/ : per questo la build usa quel percorso come base.
name: Pubblica su GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta: se ne parte uno nuovo, quello vecchio si ferma.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      # GitHub Pages non conosce gli indirizzi dell'app (/gioca/...): a una pagina che non trova serve la 404, che è la stessa app.
      - run: cp dist/cadungeon/browser/index.html dist/cadungeon/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cadungeon/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
